{% extends "base.html" %}

{% block title %}Selecionar titular - Finanças IA{% endblock %}

{% block content %}
<h2>Selecionar titular/cartão</h2>

<div class="card">
    <p>A fatura contém lançamentos de mais de um titular. Selecione qual deseja processar:</p>

    <form method="get" action="/revisar-fatura/{{ statement_id }}">
        {% for holder in holders %}
        <div class="item-row">
            <label>
                <input type="radio" name="card_last_four" value="{{ holder.last_four }}" required>
                {{ holder.name or 'Titular não identificado' }} — final {{ holder.last_four }}
            </label>
        </div>
        {% endfor %}

        <button type="submit" class="btn">Continuar</button>
    </form>
</div>
{% endblock %}
