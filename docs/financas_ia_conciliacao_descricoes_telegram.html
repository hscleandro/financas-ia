<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finanças IA • Revisar conciliação</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eef3fa;background:#0c111b}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:22px 16px 115px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.logo{font-weight:800;letter-spacing:-.5px;font-size:21px}.logo b{color:#70e0bb}.avatar{background:#222e41;padding:9px 12px;border-radius:13px;color:#a9b8ce;font-size:12px}h1{font-size:27px;letter-spacing:-1px;margin:0 0 6px}.sub{color:#9aaac0;font-size:13px;margin:0 0 22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:17px}.stat{background:#171f2e;border:1px solid #273246;padding:14px 12px;border-radius:17px;color:inherit;text-align:left;cursor:pointer}.stat strong{display:block;font-size:22px}.stat small{color:#a3b1c6;font-size:11px}.stat.active{border-color:#70e0bb;background:#193c36;box-shadow:inset 0 0 0 1px #367e68}.stat.active strong{color:#91f1cb}.progress{background:#171f2e;border:1px solid #273246;border-radius:15px;padding:12px 14px;margin-bottom:16px}.progress-top{display:flex;justify-content:space-between;gap:8px;color:#a6b5c9;font-size:12px;margin-bottom:9px}.progress-top strong{color:#91f1cb}.track{height:7px;background:#2b384e;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#70e0bb;border-radius:20px;transition:width .2s}.section-info{color:#a6b5c9;font-size:13px;margin:12px 0 16px}.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}.link{background:none;border:0;color:#91f1cb;cursor:pointer;font-weight:650;font-size:12px;padding:7px}.expense{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:11px;align-items:start;background:#171f2e;border:1px solid #28354a;border-radius:17px;padding:15px;margin-bottom:10px}.expense input[type=checkbox]{accent-color:#66dbb3;width:18px;height:18px;margin:6px 0;cursor:pointer}.name{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}.date{font-size:12px;color:#94a7c0;margin-top:5px}.amount{font-weight:800;font-size:15px;white-space:nowrap}.category{grid-column:2/4;width:100%;border:1px solid #34445b;border-radius:10px;background:#202c3e;color:#dce7f6;padding:10px;font-size:13px}.match-pair{grid-column:2/4;display:grid;gap:9px;border-top:1px solid #2b384e;padding-top:11px}.match-label{font-size:10px;color:#91f1cb;font-weight:750;letter-spacing:.5px;text-transform:uppercase}.match-bank{font-size:14px;font-weight:650;color:#eef3fa}.match-caption{font-size:11px;color:#94a7c0}.pill{display:inline-block;color:#91f1cb;background:#1d443b;border-radius:7px;padding:3px 7px;font-size:10px;margin-top:7px}.footer{position:sticky;bottom:0;background:#0c111bf2;backdrop-filter:blur(14px);padding:14px 0 4px;border-top:1px solid #263348;display:flex;align-items:center;justify-content:space-between;gap:12px}.footer small{display:block;color:#9eacc0}.footer strong{font-size:17px}.actions{display:flex;gap:8px}.btn{background:#70e0bb;border:0;border-radius:12px;padding:12px 14px;font-weight:800;color:#0c2520;cursor:pointer;font-size:12px}.btn.secondary{background:#222e41;border:1px solid #405069;color:#dce7f6}.btn:disabled{opacity:.4;cursor:not-allowed}.empty{padding:22px;border:1px dashed #34445b;border-radius:14px;color:#a8bad1;text-align:center;font-size:13px}.history{margin-top:20px;border-top:1px solid #273246;padding-top:14px}.history summary{cursor:pointer;color:#91f1cb;font-weight:700;font-size:13px}.history-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #273246;font-size:12px}.history-item small{color:#a3b1c6;display:block;margin-top:4px}.status{color:#91f1cb;white-space:nowrap}.status.ignored{color:#b7c4d5}.hint{font-size:11px;color:#8193aa;margin:14px 0}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#193c36;color:#b6ffe0;padding:12px 16px;border:1px solid #367e68;border-radius:12px;z-index:10;max-width:90%;font-size:13px}.hidden{display:none}@media(max-width:480px){.app{padding:17px 12px 105px}header{margin-bottom:25px}.amount{font-size:14px}.expense{gap:8px;padding:12px}.stat{padding:12px 8px}.stat strong{font-size:19px}.footer{align-items:stretch}.actions{flex-direction:column}.btn{padding:10px 11px;font-size:11px}.footer strong{font-size:14px}}
</style></head><body><main class="app"><header><div class="logo">Finanças <b>IA</b></div><div class="avatar">Minha conta</div></header><h1>Revisar conciliação</h1><p class="sub">Confira os lançamentos e revise no seu ritmo.</p><div class="stats" id="stats"></div><div class="progress"><div class="progress-top"><span id="progress-label">Progresso da revisão</span><strong id="progress-count">0 de 0 revisados</strong></div><div class="track"><div class="fill" id="progress-fill"></div></div></div><div class="tools"><span class="section-info" id="section-info"></span><button class="link" id="select-all">Selecionar todos</button></div><div id="items"></div><details class="history"><summary id="history-title">Histórico de decisões (0)</summary><div id="history-items"></div></details><p class="hint">Protótipo demonstrativo: as decisões ficam salvas apenas neste navegador. Nenhum dado é enviado ao banco.</p><div class="footer"><div><small id="selected-count">0 selecionados</small><strong id="selected-sum">R$ 0,00</strong></div><div class="actions"><button class="btn secondary" id="ignore" disabled>Ignorar selecionados</button><button class="btn" id="approve" disabled>Aprovar selecionados</button></div></div></main><div class="toast hidden" id="toast" role="status"></div><script>
const initial=[{id:'n1',section:'new',name:'PAYPAL *DSA ACADEMY',date:'13 mar 2026 · Cartão de crédito',amount:154.45,category:'Educação',hint:'Sugestão de categoria'},{id:'n2',section:'new',name:'ELAZA COMERCIAL VAREJO',date:'16 mai 2026 · Parcela 05/10',amount:499.99,category:'Compras',hint:'Categoria sugerida'},{id:'n3',section:'new',name:'FunilariaE',date:'30 mai 2026 · Cartão de crédito',amount:600,category:'',hint:''},{id:'m1',section:'matched',name:'SUPERMERCADO EXEMPLO',bankName:'Mercado da semana',date:'18 mai 2026 · Correspondência com banco',amount:183.90,category:'Alimentação',hint:'Correspondência identificada'},{id:'m2',section:'matched',name:'POSTO EXEMPLO',bankName:'Abastecimento do carro',date:'19 mai 2026 · Correspondência com banco',amount:220,category:'Transporte',hint:'Correspondência identificada'},{id:'b1',section:'bank',name:'ACADEMIA',date:'21 mai 2026 · Registro existente no banco',amount:129.90,category:'Saúde',hint:''},{id:'b2',section:'bank',name:'STREAMING',date:'22 mai 2026 · Registro existente no banco',amount:39.90,category:'Assinaturas',hint:''}];
const labels={new:'Só na fatura',matched:'Conciliados',bank:'Só no banco'},descs={new:'Selecione as compras que deseja inserir e confira as categorias.',matched:'Compare a descrição da fatura com o nome registrado via Telegram antes de confirmar.',bank:'Revise os registros do banco que não aparecem na fatura.'},cats=['','Alimentação','Assinaturas','Casa','Compras','Educação','Manutenção','Saúde','Transporte','Outros'];let saved;try{saved=JSON.parse(localStorage.getItem('financas-ia-demo-original-v1'))}catch(e){}const state={decisions:saved?.decisions||{},categories:saved?.categories||{},section:'new',selected:new Set()};const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem('financas-ia-demo-original-v1',JSON.stringify({decisions:state.decisions,categories:state.categories}))}catch(e){}}function pending(){return initial.filter(x=>!state.decisions[x.id]&&x.section===state.section)}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2400)}function render(){const done=Object.keys(state.decisions).length;document.getElementById('stats').innerHTML=Object.keys(labels).map(k=>`<button class="stat ${state.section===k?'active':''}" data-section="${k}" aria-pressed="${state.section===k}"><strong>${initial.filter(x=>x.section===k&&!state.decisions[x.id]).length}</strong><small>${labels[k]}</small></button>`).join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{state.section=b.dataset.section;state.selected.clear();render()});document.getElementById('progress-count').textContent=`${done} de ${initial.length} revisados`;document.getElementById('progress-fill').style.width=(done/initial.length*100)+'%';document.getElementById('section-info').textContent=descs[state.section];const arr=pending();document.getElementById('items').innerHTML=arr.length?arr.map(x=>`<article class="expense"><input type="checkbox" data-check="${x.id}" aria-label="Selecionar ${esc(x.name)}" ${state.selected.has(x.id)?'checked':''}><div><div class="name">${esc(x.name)}</div><div class="date">${esc(x.date)}</div>${x.hint?`<span class="pill">${esc(x.hint)}</span>`:''}</div><div class="amount">${money(x.amount)}</div>${x.section==='matched'?`<div class="match-pair"><div><div class="match-label">Descrição na fatura</div><div class="match-bank">${esc(x.name)}</div></div><div><div class="match-label">Registrado no banco via Telegram</div><div class="match-bank">${esc(x.bankName||'Descrição não disponível')}</div><div class="match-caption">Confira as duas descrições antes de aprovar</div></div></div>`:''}<select class="category" data-cat="${x.id}" aria-label="Categoria ${esc(x.name)}">${cats.map(c=>`<option value="${esc(c)}" ${(state.categories[x.id]??x.category)===c?'selected':''}>${c||'Selecionar categoria'}</option>`).join('')}</select></article>`).join(''):'<div class="empty">Nenhum lançamento pendente nesta seção. ✓</div>';document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{el.checked?state.selected.add(el.dataset.check):state.selected.delete(el.dataset.check);updateSelection()});document.querySelectorAll('[data-cat]').forEach(el=>el.onchange=()=>{state.categories[el.dataset.cat]=el.value;persist()});const history=initial.filter(x=>state.decisions[x.id]);document.getElementById('history-title').textContent=`Histórico de decisões (${history.length})`;document.getElementById('history-items').innerHTML=history.length?history.map(x=>`<div class="history-item"><div><strong>${esc(x.name)}</strong><small>${labels[x.section]} · ${money(x.amount)}${x.section==='matched'?' · Telegram: '+esc(x.bankName||'Descrição não disponível'):''}</small></div><span class="status ${state.decisions[x.id]==='ignored'?'ignored':''}">${state.decisions[x.id]==='approved'?'✓ Aprovado':'— Ignorado'}</span></div>`).join(''):'<p class="hint">Nenhum lançamento revisado ainda.</p>';document.getElementById('select-all').textContent=arr.length&&arr.every(x=>state.selected.has(x.id))?'Desmarcar todos':'Selecionar todos';updateSelection()}function updateSelection(){const selected=pending().filter(x=>state.selected.has(x.id));document.getElementById('selected-count').textContent=`${selected.length} selecionado(s)`;document.getElementById('selected-sum').textContent=money(selected.reduce((a,x)=>a+x.amount,0));document.getElementById('approve').disabled=document.getElementById('ignore').disabled=!selected.length}document.getElementById('select-all').onclick=()=>{const arr=pending();if(arr.every(x=>state.selected.has(x.id)))state.selected.clear();else arr.forEach(x=>state.selected.add(x.id));render()};function act(status){const chosen=pending().filter(x=>state.selected.has(x.id));if(!chosen.length)return;if(status==='approved'&&state.section==='new'&&chosen.some(x=>!(state.categories[x.id]??x.category))){toast('Selecione a categoria das compras antes de aprovar.');return}chosen.forEach(x=>state.decisions[x.id]=status);state.selected.clear();persist();render();toast(`${chosen.length} lançamento(s) ${status==='approved'?'aprovado(s)':'ignorado(s)'}.`)}document.getElementById('approve').onclick=()=>act('approved');document.getElementById('ignore').onclick=()=>act('ignored');render();
</script></body></html>
